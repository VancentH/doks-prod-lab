<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" width="480" height="240" role="img" aria-labelledby="title desc">
<title id="title">GitOps · Argo CD</title>
<desc id="desc">Argo CD runs on DOKS and syncs from the infra and apps Git repos. Git is the single source: every app and config on the cluster, including Argo Rollouts, Istio, the OTel Demo and the observability stack, is deployed from there.</desc>
