<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" width="480" height="240" role="img" aria-labelledby="title desc">
<title id="title">Observability</title>
<desc id="desc">The observability stack collects from the OTel Demo: Prometheus for metrics, Loki for logs, Tempo for traces, and Grafana to view them together.</desc>
