<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-labelledby="title desc">
<title id="title">Terraform 佈建、Argo CD 部署、Rancher 管理</title>
<desc id="desc">k3s 管理叢集執行 Rancher、cert-manager 與 Vault；DOKS workload 叢集執行應用程式。Terraform 佈建兩個叢集，Argo CD 從 Git 同步。</desc>
