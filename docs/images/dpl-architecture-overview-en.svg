<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-labelledby="title desc">
<title id="title">Terraform provisions, Argo CD deploys, Rancher manages</title>
<desc id="desc">A k3s management cluster runs Rancher, cert-manager and Vault; a DOKS workload cluster runs the apps. Terraform provisions both, Argo CD syncs from Git.</desc>
