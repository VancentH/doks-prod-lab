<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" width="480" height="240" role="img" aria-labelledby="title desc">
<title id="title">Management · Rancher</title>
<desc id="desc">The Rancher agent (cattle-cluster-agent) on DOKS connects back to Rancher on the management cluster. Rancher provides SSO, RBAC, Projects and a multi-cluster overview. cert-manager issues Rancher's TLS certificates, and rancher-backup takes backups.</desc>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&amp;display=swap');
  text { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
</style>
<rect width="100%" height="100%" fill="#020617"/>
<defs>
  <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/></marker>
  <marker id="arrowstart" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto"><polygon points="10 0, 0 3.5, 10 7" fill="#64748b"/></marker>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern>
</defs>
<rect width="100%" height="100%" fill="url(#grid)"/>
<rect x="205" y="10" width="270" height="220" rx="10" fill="rgba(15, 23, 42, 0.4)" stroke="#94a3b8" stroke-width="1" stroke-dasharray="8,4"/>
<text x="217" y="28" fill="#94a3b8" font-size="11" font-weight="600">Mgmt cluster · k3s</text>
