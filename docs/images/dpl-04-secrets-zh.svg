<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" width="480" height="240" role="img" aria-labelledby="title desc">
<title id="title">密鑰 · Vault</title>
<desc id="desc">密鑰存放在管理叢集的 Vault，不在 DOKS 裡。DOKS 上的 External Secrets 把密鑰同步進叢集，供應用程式使用。</desc>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&amp;display=swap');
  text { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
</style>
<rect width="100%" height="100%" fill="#020617"/>
<defs>
  <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/></marker>
  <marker id="arrowstart" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto"><polygon points="10 0, 0 3.5, 10 7" fill="#64748b"/></marker>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern>
</defs>
<rect width="100%" height="100%" fill="url(#grid)"/>
<rect x="10" y="40" width="150" height="160" rx="10" fill="rgba(15, 23, 42, 0.4)" stroke="#94a3b8" stroke-width="1" stroke-dasharray="8,4"/>
<text x="22" y="58" fill="#94a3b8" font-size="11" font-weight="600">管理叢集</text>
<rect x="185" y="40" width="285" height="160" rx="10" fill="rgba(15, 23, 42, 0.4)" stroke="#22d3ee" stroke-width="1" stroke-dasharray="8,4"/>
<text x="197" y="58" fill="#22d3ee" font-size="11" font-weight="600">DOKS</text>
<path d="M 145 120 H 203" fill="none" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrowhead)"/>
<text x="174" y="113" fill="#94a3b8" font-size="8" text-anchor="middle">同步</text>
<path d="M 325 120 H 343" fill="none" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrowhead)"/>
<rect x="25" y="90" width="120" height="60" rx="6" fill="rgba(76, 29, 149, 0.4)" stroke="#a78bfa" stroke-width="1.5"/>
<text x="85.0" y="118.5" fill="white" font-size="12" font-weight="600" text-anchor="middle">Vault</text>
<text x="85.0" y="132.5" fill="#94a3b8" font-size="9" text-anchor="middle">密鑰儲存</text>
<rect x="205" y="90" width="120" height="60" rx="6" fill="rgba(136, 19, 55, 0.4)" stroke="#fb7185" stroke-width="1.5"/>
<text x="265.0" y="117.5" fill="white" font-size="10" font-weight="600" text-anchor="middle">External Secrets</text>
<text x="265.0" y="131.5" fill="#94a3b8" font-size="8" text-anchor="middle">operator</text>
<rect x="345" y="90" width="110" height="60" rx="6" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1.5"/>
<text x="400.0" y="118.0" fill="white" font-size="11" font-weight="600" text-anchor="middle">應用程式</text>
<text x="400.0" y="132.0" fill="#94a3b8" font-size="8" text-anchor="middle">使用密鑰</text>
<text x="240" y="226" fill="#a78bfa" font-size="9" text-anchor="middle">密鑰放在 DOKS 之外</text>
</svg>
